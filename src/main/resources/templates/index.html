<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <!-- inizio fragment head -->
  <head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <title th:text="${title}">Title</title>
  </head>
  <!-- fine fragment head -->
  <body>
    <!-- inizio navbar -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Aulab Chronicle</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ROLE_WRITER')">
          <a class="nav-link" href="/articles/create">Crea Articolo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/articles">Tutti gli articoli</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
          <div class="d-flex">
            <a class="nav-link" href="/admin/dashboard">Dashboard admin</a>
            <div class="mt-1" th:if="${careerRequests >0}">
              <i class="fas fa-bell fa-l pt-2"></i>
              <span class="badge rounded-pill bg-danger text-white px-1" th:text="${careerRequests}"></span>
            </div>
          </div>
        </li>

        <li class="nav-item" sec:authorize="hasRole('ROLE_REVISOR')">
          <div class="d-flex">
            <a class="nav-link" href="/revisor/dashboard">Dashboard revisor</a>
            <div class="mt-1" th:if="${articlesToBeRevised >0}">
              <i class="fas fa-bell fa-l pt-2"></i>
              <span class="badge rounded-pill bg-danger text-white px-1" th:text="${articlesToBeRevised}"></span>
            </div>
          </div>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ROLE_WRITER')">
            <a class="nav-link" href="/writer/dashboard">Dashboard writer</a>
        </li>

        
        
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false" id="navbarDropdown">
            Accesso
          </a>
          <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" th:href="@{/register}" aria-current="page">Register</a></li>
            <li><a class="dropdown-item" th:href="@{/login}" aria-current="page">Login</a></li>
            <li><a class="dropdown-item" th:href="@{/logout}" aria-current="page">Logout</a></li>
            
          </ul>
        </li>
      </ul>
      <div sec:authorize="isAuthenticated" th:text="' Benvenuto: ' + ${#authentication.principal.fullname} + ' - ' + ${#authentication.principal.authorities[0].authority.replace('ROLE_' , '')}">Benvenuto</div>
    </div>
</div>
<form class="d-flex" th:action="@{/articles/search}" method="get">
  <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="keyword"/>
  <button class="btn btn-outline-success" type="submit">Search</button>
</form>
</nav>
<!-- fine navbar -->

<!-- inizio footer -->
 <footer th:fragment="footer" class="bg-dark text-white pt-4">
    <div class="container">
        <div class="row justify-content-between">
            <!-- company info -->
             <div class="col-md-4 mb-3">
                <a href="/"><h5>Aulab IT</h5></a>
             </div>
             <!-- contact info -->
              <div class="col-md-4 mb-3">
                <h5>Lavora con noi</h5>
                <a th:href="@{/operations/career/request}" class="btn btn-primary">Richiedi</a>
              </div>
        </div>
    </div>
    <div class="bg-secondary text-center py-2">
        <p class="mb-0">2026 Aulab Jost. All rights reserved. </p>
    </div>
 </footer>
 <!-- fine footer -->
<!-- inizio fragment script bootstrap -->
    <script th:fragment="bootstrapScript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- fine fragment script bootstrap -->
  </body>
</html>
