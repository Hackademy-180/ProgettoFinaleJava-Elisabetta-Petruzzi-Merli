<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{index :: head}">
    
</head>
<body>
    <head th:insert="~{index :: navbar}"></head>

    <div th:if="${param.notAuthorized}">
        <div class="alert alert-danger">
            Not authorized!
        </div>
    </div>
    <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
    </div>
    
    <!-- redirect error message "ruolo già assegnato" -->
     <div class="alert alert-success" th:if="${errorMessage}">
        <p th:text="${errorMessage}"></p>
     </div>

    <div class="container-fluid">
        <div class="row ms-5 vh-100 align-items-center">
            <div class="col-10">
                <h1 class="mb-5">Welcome to <span class="display-4 fw-bold d-block">New Aulab Chronicle</span></h1>
            </div>
        </div>
    </div>

    <!-- Per domani pag.20 US2: inserire sotto questo commento visione dei tre articoli nella homepage -->
     <div class="container" th:if="${articles != null and !articles.isEmpty()}">
        <div class="row justify-content-center">
            <div class="col-10 mb-5">
                <h1 class="text-center">Gli ultimi articoli</h1>
            </div>
        </div>
        <div class="row justify-content-center mb-5">
              <div class="col-12 col-md-4 d-flex justify-content-center" th:each="article:${articles}">
                    <div class="card mb-3" style="width: 18rem;">
                        <img th:src="${article.image.path}" alt="" class="card-img-top" th:if="${article.image != null}">
                        <img th:unless="${article.image != null}" th:src="@{/images/default.jpg}" alt="" class="card-img-top">

                        <div class="card-body">
                            <h5 class="card-title" th:text="${article.title}"></h5>
                            <p class="card-text" th:text="${article.subtitle}"></p>
                            <p class="card-text" th:text="${article.user.username}"></p>

                            <a th:href="@{/articles/detail/{id}(id=${article.id})}" class="btn btn-primary">Leggi</a>

                        </div>
                    </div>
                </div>
        </div>
     </div>
     
    <head th:insert="~{index :: footer}"></head>
    <script th:replace="~{index :: bootstrapScript}"></script>

</body>
</html>
